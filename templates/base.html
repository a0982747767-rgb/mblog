<!DOCTYPE html>

<html>

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >


    <title>

        {% block title %}
        {% endblock %}

    </title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body>


<div class="container-fluid">


    {% include 'header.html' %}


    <div class="row">


        <!-- ========================= -->
        <!-- 左側 Menu -->
        <!-- ========================= -->

        <div class="col-sm-3 col-md-3">


            <div class="card">


                <div class="card-header">

                    <h3>
                        Menu
                    </h3>

                </div>


                <div class="card-body">


                    <div class="list-group">


                        <a
                            href="/"
                            class="list-group-item list-group-item-action"
                        >
                            HOME
                        </a>


                        <a
                            href="/list/"
                            class="list-group-item list-group-item-action"
                        >
                            二手列表
                        </a>


                        <a
                            href="/carlist/"
                            class="list-group-item list-group-item-action"
                        >
                            二手車庫存
                        </a>


                        <a
                            href="/carprice/"
                            class="list-group-item list-group-item-action"
                        >
                            二手車價格
                        </a>


                        <a
                            href="/about/"
                            class="list-group-item list-group-item-action"
                        >
                            關於我
                        </a>


                        <a
                            href="/news/"
                            class="list-group-item list-group-item-action"
                        >
                            新聞直播
                        </a>


                        <a
                            href="https://news.google.com/"
                            target="_blank"
                            class="list-group-item list-group-item-action"
                        >
                            即時新聞
                        </a>


                        <a
                            href="https://www.youtube.com/"
                            target="_blank"
                            class="list-group-item list-group-item-action"
                        >
                            YouTube
                        </a>


                    </div>


                </div>


            </div>


        </div>



        <!-- ========================= -->
        <!-- 右側主要內容 -->
        <!-- ========================= -->

        <div class="col-sm-9 col-md-9">


            <div class="card">


                <div class="card-header">

                    {% block headmessage %}
                    {% endblock %}

                </div>


                <div class="card-body">

                    {% block content %}
                    {% endblock %}

                </div>


                <div class="card-footer">

                    {% include 'footer.html' %}

                </div>


            </div>


        </div>


    </div>


</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
>
</script>


</body>

</html>
